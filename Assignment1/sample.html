
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS 576 Local Newsletter Test</title>
</head>
<body>
    <h1>Newsletter Signup Test</h1>
    <p>This form is only for local testing.</p>

    <form action="/subscribe" method="POST">
        <label for="name">Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="address">Address:</label>
        <input
            type="text"
            id="address"
            name="address"
            required
        >
        label for="city">City:</label>
        <input
            type="text"
            id="city"
            name="city"
            required
        >   
        label for="state">State:</label>
        <input
            type="text"
            id="state"
            name="state"
            required
        >
        label for="zip">Zip Code:</label>
        <input
            type="text"
            id="zip"
            name="zip"
            required
        >
        label for="country">Country:</label>
        <input
            type="text"
            id="country"
            name="country"
            required
        >
        <button type="submit">Subscribe</button>
    </form>
</body>
</html>
